<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guías · AI-Mae · Hecho en Osa</title>
<meta name="theme-color" content="#0d6f73">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap">
</head>
<body>
<style>
/* Layout: two one-pager "sheets", each a grid of cards; ES/EN toggle top right. Palette from the mentor handbook. */
:root{
  --bg:#f2f0e4; --sheet:#fbfaf3; --ink:#1d2622; --muted:#685d3e; --line:#e2ddc8;
  --teal:#0d6f73; --gold:#f5d253; --card:#ffffff; --tint:#eef5f3;
  --font:"Noto Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1413; --sheet:#111a18; --ink:#e7ece4; --muted:#bdb290; --line:#27332f;
  --teal:#62b6b4; --gold:#f5d253; --card:#17211e; --tint:#14211f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1413; --sheet:#111a18; --ink:#e7ece4; --muted:#bdb290; --line:#27332f;
  --teal:#62b6b4; --gold:#f5d253; --card:#17211e; --tint:#14211f; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;display:grid;gap:28px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font:800 11px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.lang{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:var(--muted);font:600 12px var(--font);padding:5px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--teal);color:#fff}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:36px clamp(18px,4vw,44px) 40px;display:grid;gap:28px}
.head{display:grid;gap:6px}
.head .n{font:800 12px var(--font);color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.head h1{margin:0;font:800 clamp(26px,4vw,38px)/1.08 var(--font);letter-spacing:-.015em;text-wrap:balance}
.head i{display:block;width:52px;height:3px;background:var(--gold);border-radius:3px;margin-top:4px}
.head p{margin:2px 0 0;color:var(--muted);max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.big{font-size:18px;font-weight:600;line-height:1.4}
.num{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1d2622;font-weight:800;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 24px;display:grid;gap:14px;line-height:1.6;align-content:start;min-width:0}
.card h2{margin:0;font:800 17px/1.2 var(--font);color:var(--teal);display:flex;gap:8px;align-items:baseline}
.card h2 small{font:600 11px var(--font);color:var(--muted);letter-spacing:.04em}
.card p{margin:0}
.card ul,.card ol{margin:0;padding-inline-start:18px;display:grid;gap:3px}
.ex{background:var(--tint);border-radius:12px;padding:12px 14px;font-size:15px}
.ex b{color:var(--teal)}
.chain{display:grid;gap:8px;font-size:15px}
.chain span{display:block;padding:9px 12px;border-radius:8px;background:var(--tint)}
.chain span.real{background:var(--gold);color:#1d2622;font-weight:800}
.wide{grid-column:1/-1}
.prd{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;counter-reset:p}
.prd div{border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.prd b{font:800 14px var(--font)}
.prd span{font-size:13px;color:var(--muted)}
.no{color:#b3261e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .no{color:#f28b82}}
:root[data-theme="dark"] .no{color:#f28b82}
.foot{font-size:12.5px;color:var(--muted)}
.backlink{color:var(--teal);font:700 14px var(--font);text-decoration:none}
body{margin:0}
@media print{.bar,.backlink{display:none}.sheet{break-after:page;border:0}body{background:#fff}}
</style>

<div class="wrap">
  <a class="backlink" href="/">← AI-Mae</a>
  <div class="bar">
    <span class="eyebrow">Hecho en Osa · Hackathon + Science Fair 2026</span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-l="es" aria-pressed="true">Español</button>
      <button type="button" data-l="en" aria-pressed="false">English</button>
    </div>
  </div>
  <div id="pages"></div>
</div>

<script>
const D={
es:{p1:{n:"Página 1 · Semana 3",t:"Encuentra un problema real",s:"Una hoja de papel. Paso a paso."},
 problem:{t:"1 · El problema",b:`<p class="big">Algo que le complica la vida a gente real.</p><p>Escribe: <b>"Mi problema es ___."</b></p><div class="ex">Ejemplo: <b>basura en la playa</b></div>`},
 whys:{t:"2 · Los 5 porqués",b:`<p class="big">Pregunta "¿Por qué?" hasta llegar al problema REAL.</p><div class="chain"><span class="real">REAL: nadie está a cargo</span><span>¿Por qué? Nadie vacía los basureros</span><span>¿Por qué? No hay basureros</span><span>Basura en la playa</span></div>`},
 persona:{t:"3 · Persona",b:`<p class="big">UNA persona inventada que tiene tu problema.</p><p>Nombre, edad, una frase.</p><div class="ex"><b>Rosa, 45</b>, tiene una soda. "Recojo basura cada mañana."</div><p>¿Para qué? Cada idea se vuelve: <b>"¿Rosa lo usaría?"</b></p>`},
 interview:{t:"4 · Entrevistas",b:`<p class="big">Pregunta por SU vida. No vendas tu idea.</p><ul><li>¿Cómo es tu día normal?</li><li>¿Qué es lo más difícil?</li><li>Cuéntame la última vez que pasó.</li></ul><p class="no">Nunca: "¿Usarías mi app?"</p><div class="ex"><b>2 personas</b> · 10 minutos · anota sus palabras exactas</div>`},
 strangers:{t:"5 · Hablar con desconocidos",b:`<p class="big">Es normal sentir nervios. Hazlo con miedo.</p><div class="ex">"Hola, hago un proyecto sobre [problema]. ¿Te hago 3 preguntas?"</div><p>Siempre con un adulto cerca · solo nombres · pide permiso para grabar.</p>`},
 p2:{n:"Página 2 · Semana 3 → 4",t:"Decide qué construir",s:"De todo lo que aprendiste, a UNA cosa."},
 fp:{t:"Primeros principios",b:`<p class="big">¿Qué es verdad? ¿Qué solo suponemos?</p><div class="ex">"Necesitamos una app." Verdad: nadie vacía los basureros. <b>¿Quizás basta una lista en la pared?</b></div>`},
 mvp:{t:"MVP",b:`<p class="big">La versión más pequeña que ya ayuda.</p><p>¿Tu frase tiene "y"? Son dos cosas. Elige una.</p><div class="ex"><b>Sí:</b> "Avisa a quién le toca vaciar el basurero."</div>`},
 prd:{t:"PRD",b:`<p class="big">Una página: QUÉ construyes y PARA QUIÉN.</p>`},
 parts:[["1","Nombre del proyecto"],["2","Nuestra idea"],["3","El problema"],["4","5 porqués"],["5","Persona"],["6","Entrevistas y qué aprendimos"],["7","La única cosa (MVP)"]],
 foot:"Hecho en Osa · Construyendo el futuro desde el corazón de Costa Rica."},
en:{p1:{n:"Page 1 · Week 3",t:"Find a real problem",s:"One sheet of paper. Step by step."},
 problem:{t:"1 · The problem",b:`<p class="big">Something that makes life harder for real people.</p><p>Write: <b>"My problem is ___."</b></p><div class="ex">Example: <b>trash on the beach</b></div>`},
 whys:{t:"2 · The 5 Whys",b:`<p class="big">Ask "Why?" until you reach the REAL problem.</p><div class="chain"><span class="real">REAL: no one is in charge</span><span>Why? Nobody empties the bins</span><span>Why? There are no bins</span><span>Trash on the beach</span></div>`},
 persona:{t:"3 · Persona",b:`<p class="big">ONE made-up person who has your problem.</p><p>Name, age, one quote.</p><div class="ex"><b>Rosa, 45</b>, runs a soda. "I pick up trash every morning."</div><p>Why? Every idea becomes: <b>"Would Rosa use this?"</b></p>`},
 interview:{t:"4 · Interviews",b:`<p class="big">Ask about THEIR life. Don't sell your idea.</p><ul><li>What's a normal day like?</li><li>What's the hardest part?</li><li>Tell me about the last time it happened.</li></ul><p class="no">Never: "Would you use my app?"</p><div class="ex"><b>2 people</b> · 10 minutes · write their exact words</div>`},
 strangers:{t:"5 · Talking to strangers",b:`<p class="big">Feeling nervous is normal. Do it scared.</p><div class="ex">"Hi, I'm doing a project about [problem]. Can I ask 3 questions?"</div><p>Always with an adult nearby · first names only · ask before recording.</p>`},
 p2:{n:"Page 2 · Week 3 → 4",t:"Decide what to build",s:"From everything you learned, to ONE thing."},
 fp:{t:"First principles",b:`<p class="big">What is true? What are we only guessing?</p><div class="ex">"We need an app." True: nobody empties the bins. <b>Maybe a list on the wall is enough?</b></div>`},
 mvp:{t:"MVP",b:`<p class="big">The smallest version that already helps.</p><p>Your sentence has "and"? That's two things. Pick one.</p><div class="ex"><b>Yes:</b> "It tells whose turn it is to empty the bin."</div>`},
 prd:{t:"PRD",b:`<p class="big">One page: WHAT you're building and FOR WHOM.</p>`},
 parts:[["1","Project name"],["2","Our idea"],["3","The problem"],["4","5 Whys"],["5","Persona"],["6","Interviews and what we learned"],["7","The one thing (MVP)"]],
 foot:"Hecho en Osa · Building the future from the heart of Costa Rica."}
};
let lang="es";try{const l=localStorage.getItem("heo-1p");if(l&&D[l])lang=l}catch{}
const card=(c,extra="")=>`<section class="card ${extra}"><h2>${c.t}${c.tag?` <small>${c.tag}</small>`:""}</h2>${c.b}</section>`;
function draw(){
  const d=D[lang];document.documentElement.lang=lang;
  const head=h=>`<header class="head"><span class="n">${h.n}</span><h1>${h.t}</h1><i></i><p>${h.s}</p></header>`;
  document.getElementById("pages").innerHTML=
   `<div class="sheet">${head(d.p1)}<div class="grid">${card(d.problem)}${card(d.whys)}${card(d.persona)}${card(d.interview)}${card(d.strangers)}</div><p class="foot">${d.foot}</p></div>
    <div class="sheet" style="margin-top:28px">${head(d.p2)}<div class="grid">${card(d.fp)}${card(d.mvp)}${card(d.prd)}</div>
    <div class="prd">${d.parts.map(([a,b])=>`<div><span class="num">${a}</span><b>${b}</b></div>`).join("")}</div><p class="foot">${d.foot}</p></div>`;
  for(const b of document.querySelectorAll(".lang button"))b.setAttribute("aria-pressed",b.dataset.l===lang);
}
for(const b of document.querySelectorAll(".lang button"))b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("heo-1p",lang)}catch{};draw()};
draw();
</script>

</body></html>
